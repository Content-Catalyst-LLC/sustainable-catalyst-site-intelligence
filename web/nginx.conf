server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz { add_header Content-Type text/plain; return 200 'ok\n'; }
  location = /config.js { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /service-worker.js { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate"; add_header Service-Worker-Allowed "/"; }
  location = /app/service-worker.js { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate"; add_header Service-Worker-Allowed "/app/"; }
  location ~* \.(js|css|json|geojson|png|svg|webmanifest)$ { try_files $uri =404; add_header Cache-Control "public, max-age=300"; }
  location / { try_files $uri $uri/ /index.html; }
}
