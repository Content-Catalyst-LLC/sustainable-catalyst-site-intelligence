server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|json|webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }
}
