services:
  - type: web
    name: sustainable-catalyst-site-intelligence
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SC_SI_ENVIRONMENT
        value: production
      - key: SC_SI_DEMO_MODE
        value: "true"
      - key: SC_SI_CORS_ORIGINS
        value: https://sustainablecatalyst.com
      - key: SC_SI_API_TOKEN
        sync: false
      - key: SC_SI_GA4_PROPERTY_ID
        sync: false
      - key: SC_SI_GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: SC_SI_SEARCH_CONSOLE_LIVE
        value: "true"
      - key: SC_SI_SEARCH_CONSOLE_SITE_URL
        value: https://sustainablecatalyst.com/
      - key: SC_SI_ECONOMICS_SUSTAINABILITY_ENABLED
        value: "true"
      - key: SC_SI_ECONOMICS_SUSTAINABILITY_TIMEOUT_SECONDS
        value: "9"
      - key: SC_SI_ECONOMICS_SUSTAINABILITY_CACHE_TTL_SECONDS
        value: "120"
      - key: SC_SI_INTERNATIONAL_LAW_OBSERVATORY_ENABLED
        value: "true"
      - key: SC_SI_INTERNATIONAL_LAW_OBSERVATORY_TIMEOUT_SECONDS
        value: "9"
      - key: SC_SI_INTERNATIONAL_LAW_OBSERVATORY_CACHE_TTL_SECONDS
        value: "120"
      - key: SC_SI_SCIENTIFIC_EARTH_SYSTEMS_ENABLED
        value: "true"
      - key: SC_SI_SCIENTIFIC_EARTH_SYSTEMS_TIMEOUT_SECONDS
        value: "9"
      - key: SC_SI_SCIENTIFIC_EARTH_SYSTEMS_CACHE_TTL_SECONDS
        value: "120"
      - key: SC_SI_HUMANITARIAN_CONFLICT_DISPLACEMENT_ENABLED
        value: "true"
      - key: SC_SI_HUMANITARIAN_CONFLICT_DISPLACEMENT_TIMEOUT_SECONDS
        value: "9"
      - key: SC_SI_HUMANITARIAN_CONFLICT_DISPLACEMENT_CACHE_TTL_SECONDS
        value: "90"

      - key: SC_SI_TRADE_ENERGY_RESOURCE_SECURITY_ENABLED
        value: "true"
      - key: SC_SI_TRADE_ENERGY_RESOURCE_SECURITY_TIMEOUT_SECONDS
        value: "9"
      - key: SC_SI_TRADE_ENERGY_RESOURCE_SECURITY_CACHE_TTL_SECONDS
        value: "120"
      - key: SC_SI_UNIFIED_DOSSIERS_ENABLED
        value: "true"
      - key: SC_SI_UNIFIED_DOSSIERS_MAX_RECORDS_PER_DOMAIN
        value: "40"
      # Required for full Economics, Law, Science, and Resources record workspaces.
      # Set the deployed Platform Core URL in Render; public-read auth is optional.
      - key: SC_SI_PLATFORM_CORE_ENABLED
        value: "true"
      - key: SC_SI_PLATFORM_CORE_URL
        sync: false
      - key: SC_SI_PLATFORM_CORE_PUBLIC_API_KEY
        sync: false
      # v4.35.18 Energy workspace official-source credentials.
      - key: SC_SI_EIA_API_KEY
        sync: false
      - key: SC_SI_EMBER_API_KEY
        sync: false
      - key: SC_SI_ENTSOE_SECURITY_TOKEN
        sync: false
      # v4.35.18 Climate/Atmosphere connector closure.
      - key: SC_SI_AIRNOW_API_KEY
        sync: false
      # ReliefWeb V2 humanitarian reports require an approved appname.
      - key: SC_SI_RELIEFWEB_APPNAME
        sync: false
      # v4.35.18 Agriculture/Food Security/Humanitarian connector closure.
      - key: SC_SI_HDX_HAPI_APP_IDENTIFIER
        sync: false
      - key: SC_SI_IPC_API_KEY
        sync: false

      # v4.35.18 canonical authenticated-source configuration.
      - key: SC_SI_NASA_FIRMS_MAP_KEY
        sync: false
      - key: SC_SI_USDA_NASS_API_KEY
        sync: false
      - key: SC_SI_EPA_AQS_EMAIL
        sync: false
      - key: SC_SI_EPA_AQS_KEY
        sync: false
      - key: SC_SI_COPERNICUS_MARINE_USERNAME
        sync: false
      - key: SC_SI_COPERNICUS_MARINE_PASSWORD
        sync: false
      - key: SC_SI_GLOBAL_FISHING_WATCH_API_TOKEN
        sync: false

# v2.8.0 optional environment values:
# SC_SI_ALERTS_MONITORING_ENABLED=true
# SC_SI_ALERTS_STREAM_RECONNECT_SECONDS=30
# SC_SI_ALERTS_STREAM_MAX_SIGNALS=180
# SC_SI_ALERTS_STALE_SOURCE_HOURS=72

# v2.9.0 optional environment values:
# SC_SI_COMPARATIVE_SCENARIO_STUDIO_ENABLED=true
# SC_SI_COMPARATIVE_SCENARIO_MAX_GEOGRAPHIES=5
# SC_SI_COMPARATIVE_SCENARIO_MAX_INDICATORS=12
# SC_SI_COMPARATIVE_SCENARIO_MAX_RECORDS=400

# v2.10.0 optional environment values:
# SC_SI_RESEARCH_WORKFLOWS_ENABLED=true
# SC_SI_RESEARCH_WORKFLOWS_MAX_INVESTIGATIONS=30
# SC_SI_RESEARCH_WORKFLOWS_MAX_EVIDENCE_ITEMS=120
# SC_SI_RESEARCH_WORKFLOWS_MAX_NOTES=80
# v2.11.0 optional environment values:
# SC_SI_PUBLIC_DATA_API_ENABLED=true
# SC_SI_PUBLIC_DATA_API_MAX_LIMIT=200
# SC_SI_PUBLIC_EMBEDS_ENABLED=true
# SC_SI_PUBLIC_EMBED_ALLOWED_ORIGINS=https://partner.example
# SC_SI_INSTITUTION_NAME=Sustainable Catalyst
# SC_SI_INSTITUTION_WEBSITE=https://sustainablecatalyst.com
# SC_SI_INSTITUTION_LOGO_URL=
# SC_SI_INSTITUTION_CONTACT=
# SC_SI_INSTITUTION_ACCENT=#8b1e3f
# v2.12.1 optional environment values:
# SC_SI_OFFLINE_EXPERIENCE_ENABLED=true
# SC_SI_SERVICE_WORKER_ENABLED=true
# SC_SI_OFFLINE_CACHE_MAX_ENTRIES=120
# SC_SI_OFFLINE_CACHE_TTL_HOURS=24
# SC_SI_LOW_BANDWIDTH_DEFAULT=false

