services:
  site-intelligence:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sc-site-intelligence
    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      PORT: "8091"

    volumes:
      - ./secrets/google-service-account.json:/run/secrets/google-service-account.json:ro

    networks:
      - sc-internal

    ports:
      - "127.0.0.1:8091:8091"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  sc-internal:
    external: true
    name: sc-internal
