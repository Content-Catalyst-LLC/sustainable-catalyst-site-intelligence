name: SC RVF official soil screening
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/sc-rvf-scientific-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - name: Source and ownership regressions
        env:
          PYTHONPATH: backend
        run: python -m pytest -o addopts="" -q backend/tests/test_scientific_soil_screening.py
