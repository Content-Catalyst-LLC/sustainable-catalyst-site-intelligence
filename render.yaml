# SC_SI_FEDERATION_RECORDS_PATH=/var/data/federation-exchange/records_v2240.jsonl
# SC_SI_FEDERATION_MANIFESTS_PATH=/var/data/federation-exchange/manifests_v2240.jsonl
# SC_SI_FEDERATION_IMPORTS_PATH=/var/data/federation-exchange/imports_v2240.jsonl
# SC_SI_FEDERATION_TRUST_PATH=/var/data/federation-exchange/trust_v2240.jsonl
# SC_SI_FEDERATION_SIGNING_KEY=
