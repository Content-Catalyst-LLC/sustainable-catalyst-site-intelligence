# SC_SI_INSTITUTIONAL_WORKSPACES_ASSIGNMENTS_PATH=/var/data/institutional-workspaces/assignments_v2220.jsonl
# SC_SI_INSTITUTIONAL_WORKSPACES_COMMENTS_PATH=/var/data/institutional-workspaces/comments_v2220.jsonl
# SC_SI_INSTITUTIONAL_WORKSPACES_REVIEWS_PATH=/var/data/institutional-workspaces/evidence_reviews_v2220.jsonl
# SC_SI_INSTITUTIONAL_WORKSPACES_COLLECTIONS_PATH=/var/data/institutional-workspaces/source_collections_v2220.jsonl
# SC_SI_INSTITUTIONAL_WORKSPACES_ACTIVITY_PATH=/var/data/institutional-workspaces/activity_v2220.jsonl
# SC_SI_INSTITUTIONAL_WORKSPACES_RETENTION_PATH=/var/data/institutional-workspaces/retention_v2220.jsonl

